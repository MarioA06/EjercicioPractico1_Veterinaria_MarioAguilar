<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla/base :: cabecera}"></head>
    <body>
        <header th:replace="~{plantilla/base :: encabezado}"></header>
        <nav th:replace="~{plantilla/base :: navegacion}"></nav>

        <main class="container py-4">
            <h2>Citas programadas</h2>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Mascota</th>
                            <th>Propietario</th>
                            <th>Fecha</th>
                            <th>Servicio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cita : ${citasProgramadas}">
                            <td th:text="${cita.nombreMascota}"></td>
                            <td th:text="${cita.nombrePropietario}"></td>
                            <td th:text="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy')}"></td>
                            <td th:text="${cita.servicio.nombreServicio}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${#lists.isEmpty(citasProgramadas)}">
                No hay citas programadas.
            </p>
        </main>

        <footer th:replace="~{plantilla/base :: pie}"></footer>
    </body>
</html>
